sentence=Reliable potentiometer and joystick inputs with explicit validity, calibration, shaping, filtering, and slew limiting.
paragraph=Zero-allocation Arduino input library for LinearPot, Joystick2D, ContinuousPot, and SteppedPot with explicit sample validity and errors, strict or permissive calibration, independent processing stages, timing-gap protection, joystick geometry policies, continuous-wrap plausibility checks, durable step-change sequencing, rolling jitter tools, generic readers, and ESP32 ADC helpers. PotIO owns signal conditioning rather than application safety policy and has no dependency on other LMB libraries. ESP32-S3 is the primary reference target; other listed architectures are compile-validation targets for the portable core.
category=Signal Input/Output
